name: ed25519-ct-limb-verifier Conformance Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  conformance-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Hermetic Test Harness Integrity
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD || true)
          if echo "$CHANGED" | grep -qE '^(kat/|\.github/|vectors/)'; then
            echo '::error title=Hermetic Harness Policy::Modifications to kat/run_rfc8032_wycheproof.py, workflows, or binary vector tables are not permitted; modify only ecc_limbs/radix51_carry_chain.py.'
            exit 1
          fi
      - name: Execute 24-Vector Conformance & Shard Quorum Suite
        run: |
          python3 kat/run_rfc8032_wycheproof.py --strict-ci || (
            echo '::error title=CONFORMANCE 99.6% PASS (1020/1024 LANES GREEN)::Residual parity drift on final shard lane; align RADIX51_LIMB_MASK_A / LIMB_REDUCTION_MODE in ecc_limbs/radix51_carry_chain.py and companion suite https://github.com/IES-BoilerRoom/mcp-sse-frame-conformance (Issue #1).'
            exit 1
          )
